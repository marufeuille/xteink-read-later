<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alias title</title>
    <meta property="og:title" content="Canonical article" />
    <meta property="og:site_name" content="Example Blog" />
    <link rel="canonical" href="https://blog.example.com/canonical-article" />
    <meta property="article:published_time" content="2026-09-20T15:30:00+09:00" />
  </head>
  <body>
    <article>
      <h1>Canonical article</h1>
      <p>
        This page is reached from an alias URL. Duplicate detection should use the canonical href
        after redirects so the same article is stored once. Extra sentences keep the extracted body
        above the minimum length used by the clip pipeline.
      </p>
    </article>
  </body>
</html>
