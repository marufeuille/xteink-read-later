<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Highlighted code</title>
  </head>
  <body>
    <article>
      <h1>Highlighted code</h1>
      <p>
        Syntax highlighters wrap tokens in span tags inside pre/code. Those spans must not become
        visible markup in the extracted HTML, and the code element itself must remain an element.
      </p>
      <pre><code class="language-js"><span class="token">const</span> x = 1;</code></pre>
    </article>
  </body>
</html>
