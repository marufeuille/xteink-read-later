      <h1>日付のないメモ</h1>
      <p>
        公開日メタデータが無い記事。発見日を公開日の代わりには使わない。本文は十分長くして抽出できる。
        候補一覧では公開日不明のグループに入れる。
      </p>
      <p>
        本文が短いと抽出失敗になり、無料全文を確認したことにはならない。この段落は抽出できる長さを確保するためにある。
        公開日不明でも候補としては残し、発見日を公開日欄にコピーしない。
      </p>
    </article>
