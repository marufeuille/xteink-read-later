name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Path filters (MAR-149): .github/scripts/ci-changed-paths.sh
# Do not set on.paths or on.paths-ignore. A skipped workflow leaves the
# required check merge-gate pending. Job-level if skips are success for
# branch protection; merge-gate still runs and accepts success or skipped
# for check and simulator images. failure and cancelled fail the gate.
# Unknown paths run the heavy jobs. See docs/github-merge-gates.md.

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      check: ${{ steps.filter.outputs.check }}
      simulator: ${{ steps.filter.outputs.simulator }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        run: bash .github/scripts/ci-changed-paths.sh github

  check:
    name: typecheck, unit, e2e
    needs: changes
    if: ${{ needs.changes.outputs.check == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: |
          cp .dev.vars.example .dev.vars
          npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: E2E tests
        run: npm run test:e2e

  simulator-images:
    name: simulator images
    needs: changes
    if: ${{ needs.changes.outputs.simulator == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install SDL2, OpenSSL, and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libsdl2-dev \
            libssl-dev \
            xvfb \
            curl \
            python3-venv
      - name: Install PlatformIO
        run: |
          python3 -m venv "$HOME/.platformio-venv"
          "$HOME/.platformio-venv/bin/pip" install 'platformio==6.1.19'
          echo "$HOME/.platformio-venv/bin" >> "$GITHUB_PATH"
      - name: Check PlatformIO
        run: pio --version
      - name: Install
        run: npm ci
      - name: Native JPEGDEC image bands
        run: npm run simulator:images
      - name: Upload simulator screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: simulator/out
          if-no-files-found: ignore

  merge-gate:
    name: merge-gate
    if: always()
    needs: [changes, check, simulator-images]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require check and simulator success or path skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          SIMULATOR_RESULT: ${{ needs.simulator-images.result }}
        run: bash .github/scripts/ci-merge-gate.sh

  deploy:
    name: deploy worker
    needs: [changes, check, simulator-images]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.changes.outputs.deploy == 'true' && needs.check.result == 'success' && (needs.simulator-images.result == 'success' || needs.simulator-images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      github_sha: ${{ steps.revision.outputs.github_sha }}
      worker_version: ${{ steps.revision.outputs.worker_version }}
      previous_worker_version: ${{ steps.previous.outputs.previous_worker_version }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Ensure R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-r2-bucket.sh
      - name: Ensure clip queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-clip-queue.sh
      - name: Ensure feed queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-feed-queue.sh
      - name: Ensure digest queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-digest-queue.sh
      - name: Ensure D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-d1-database.sh
      - name: Record previous worker version
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/record-deploy-revision.sh before
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy
      - name: Record deployed revision
        id: revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/record-deploy-revision.sh after

  # Post-deploy only. A path-filter skip or a failed deploy leaves this job skipped.
  # Re-running the deploy job re-runs this job because it needs: deploy.
  # Missing smoke secrets or an unreachable Pages article log 未設定 and exit 0.
  deploy-smoke:
    name: deploy smoke
    needs: [deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    # Step timeouts: checkout 1 + setup 1 + install 3 + run 8 + delete 2 + notify 1 + export 1 = 17.
    # The job allows 18 so a full wait, delete, notify, and export can all finish.
    timeout-minutes: 18
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      failedStep: ${{ steps.result.outputs.failedStep }}
      errorKind: ${{ steps.result.outputs.errorKind }}
      cleanupErrorKind: ${{ steps.result.outputs.cleanupErrorKind }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: 22
          cache: npm
      - name: Install
        timeout-minutes: 3
        run: npm ci
      - name: Run deploy smoke
        timeout-minutes: 8
        env:
          SMOKE_CLIP_TOKEN: ${{ secrets.SMOKE_CLIP_TOKEN }}
          SMOKE_OPDS_USERNAME: ${{ secrets.SMOKE_OPDS_USERNAME }}
          SMOKE_OPDS_PASSWORD: ${{ secrets.SMOKE_OPDS_PASSWORD }}
          SMOKE_SLACK_WEBHOOK_URL: ${{ secrets.SMOKE_SLACK_WEBHOOK_URL }}
          SMOKE_ARTICLE_URL: ${{ vars.SMOKE_ARTICLE_URL }}
          SMOKE_ORIGIN: https://xteink-read-later.marufeuille.workers.dev
          WORKER_VERSION: ${{ needs.deploy.outputs.worker_version }}
          SMOKE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_STATE_PATH: smoke-state.json
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning src/smoke/cli.ts run
      - name: Delete smoke article
        if: always()
        timeout-minutes: 2
        env:
          SMOKE_CLIP_TOKEN: ${{ secrets.SMOKE_CLIP_TOKEN }}
          SMOKE_ARTICLE_URL: ${{ vars.SMOKE_ARTICLE_URL }}
          SMOKE_ORIGIN: https://xteink-read-later.marufeuille.workers.dev
          SMOKE_STATE_PATH: smoke-state.json
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning src/smoke/cli.ts cleanup
      - name: Notify smoke failure
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 1
        env:
          SMOKE_SLACK_WEBHOOK_URL: ${{ secrets.SMOKE_SLACK_WEBHOOK_URL }}
          WORKER_VERSION: ${{ needs.deploy.outputs.worker_version }}
          SMOKE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_STATE_PATH: smoke-state.json
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning src/smoke/cli.ts notify
      - name: Export smoke result
        id: result
        if: always()
        timeout-minutes: 1
        env:
          SMOKE_STATE_PATH: smoke-state.json
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning src/smoke/cli.ts export-outputs

  # always() so a failed or cancelled smoke does not skip this job.
  # A successful deploy on main is required. Success and unset skip do not enter.
  # Rollback uses the version id recorded before this deploy. Never id-less wrangler rollback.
  # One attempt. A failing verify smoke does not roll back again. Token is CLOUDFLARE_API_TOKEN.
  # Step timeouts: checkout 1 + setup 1 + install 3 + rollback 12 = 17. Job allows 18.
  deploy-rollback:
    name: deploy rollback
    needs: [deploy, deploy-smoke]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' && (needs.deploy-smoke.result == 'failure' || needs.deploy-smoke.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: 22
          cache: npm
      - name: Install
        timeout-minutes: 3
        run: npm ci
      - name: Roll back to the previous worker version
        timeout-minutes: 12
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_WORKER_VERSION: ${{ needs.deploy.outputs.previous_worker_version }}
          WORKER_VERSION: ${{ needs.deploy.outputs.worker_version }}
          SMOKE_OUTCOME: ${{ needs.deploy-smoke.outputs.outcome }}
          SMOKE_FAILED_STEP: ${{ needs.deploy-smoke.outputs.failedStep }}
          SMOKE_ERROR_KIND: ${{ needs.deploy-smoke.outputs.errorKind }}
          SMOKE_CLEANUP_ERROR_KIND: ${{ needs.deploy-smoke.outputs.cleanupErrorKind }}
          SMOKE_JOB_RESULT: ${{ needs.deploy-smoke.result }}
          DEPLOY_BEFORE_SHA: ${{ github.event.before }}
          SMOKE_CLIP_TOKEN: ${{ secrets.SMOKE_CLIP_TOKEN }}
          SMOKE_OPDS_USERNAME: ${{ secrets.SMOKE_OPDS_USERNAME }}
          SMOKE_OPDS_PASSWORD: ${{ secrets.SMOKE_OPDS_PASSWORD }}
          SMOKE_SLACK_WEBHOOK_URL: ${{ secrets.SMOKE_SLACK_WEBHOOK_URL }}
          SMOKE_ARTICLE_URL: ${{ vars.SMOKE_ARTICLE_URL }}
          SMOKE_ORIGIN: https://xteink-read-later.marufeuille.workers.dev
          SMOKE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_STATE_PATH: rollback-smoke-state.json
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning src/smoke/cli.ts rollback
