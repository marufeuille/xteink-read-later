name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Path filters (MAR-149): .github/scripts/ci-changed-paths.sh
# Do not set on.paths or on.paths-ignore. A skipped workflow leaves the
# required check merge-gate pending. Job-level if skips are success for
# branch protection; merge-gate still runs and accepts success or skipped
# for check and simulator images. failure and cancelled fail the gate.
# Unknown paths run the heavy jobs. See docs/github-merge-gates.md.

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      check: ${{ steps.filter.outputs.check }}
      simulator: ${{ steps.filter.outputs.simulator }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        run: bash .github/scripts/ci-changed-paths.sh github

  check:
    name: typecheck, unit, e2e
    needs: changes
    if: ${{ needs.changes.outputs.check == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: |
          cp .dev.vars.example .dev.vars
          npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: E2E tests
        run: npm run test:e2e

  simulator-images:
    name: simulator images
    needs: changes
    if: ${{ needs.changes.outputs.simulator == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install SDL2, OpenSSL, and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libsdl2-dev \
            libssl-dev \
            xvfb \
            curl \
            python3-venv
      - name: Install PlatformIO
        run: |
          python3 -m venv "$HOME/.platformio-venv"
          "$HOME/.platformio-venv/bin/pip" install 'platformio==6.1.19'
          echo "$HOME/.platformio-venv/bin" >> "$GITHUB_PATH"
      - name: Check PlatformIO
        run: pio --version
      - name: Install
        run: npm ci
      - name: Native JPEGDEC image bands
        run: npm run simulator:images
      - name: Upload simulator screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: simulator/out
          if-no-files-found: ignore

  merge-gate:
    name: merge-gate
    if: always()
    needs: [changes, check, simulator-images]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require check and simulator success or path skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          SIMULATOR_RESULT: ${{ needs.simulator-images.result }}
        run: bash .github/scripts/ci-merge-gate.sh

  deploy:
    name: deploy worker
    needs: [changes, check, simulator-images]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.changes.outputs.deploy == 'true' && needs.check.result == 'success' && (needs.simulator-images.result == 'success' || needs.simulator-images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Ensure R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-r2-bucket.sh
      - name: Ensure clip queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-clip-queue.sh
      - name: Ensure feed queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-feed-queue.sh
      - name: Ensure digest queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-digest-queue.sh
      - name: Ensure D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-d1-database.sh
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy
