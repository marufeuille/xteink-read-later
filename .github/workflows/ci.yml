name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: typecheck, unit, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: |
          cp .dev.vars.example .dev.vars
          npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: E2E tests
        run: npm run test:e2e

  simulator-images:
    name: simulator images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install SDL2, OpenSSL, and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libsdl2-dev \
            libssl-dev \
            xvfb \
            curl \
            python3-venv
      - name: Install PlatformIO
        run: |
          python3 -m venv "$HOME/.platformio-venv"
          "$HOME/.platformio-venv/bin/pip" install 'platformio==6.1.19'
          echo "$HOME/.platformio-venv/bin" >> "$GITHUB_PATH"
      - name: Check PlatformIO
        run: pio --version
      - name: Install
        run: npm ci
      - name: Native JPEGDEC image bands
        run: npm run simulator:images

  merge-gate:
    name: merge-gate
    if: always()
    needs: [check, simulator-images]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require typecheck, unit, e2e, and simulator images success
        run: |
          check='${{ needs.check.result }}'
          simulator='${{ needs.simulator-images.result }}'
          echo "check job result: ${check}"
          echo "simulator-images job result: ${simulator}"
          test "$check" = success
          test "$simulator" = success

  deploy:
    name: deploy worker
    needs: [check, simulator-images]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Ensure R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-r2-bucket.sh
      - name: Ensure clip queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-clip-queue.sh
      - name: Ensure feed queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-feed-queue.sh
      - name: Ensure digest queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-digest-queue.sh
      - name: Ensure D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-d1-database.sh
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy
