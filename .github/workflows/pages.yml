name: Pages smoke article

# Publishes pages/smoke/article.html after an owner sets GitHub Pages source to GitHub Actions.
# This workflow does not enable Pages. Until that source is set, deploy-pages fails.
# It is not a required check.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pages/smoke/article.html
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-smoke-article
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy smoke page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
